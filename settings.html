<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Alaxee Proxy · 完整设置</title>
  <link rel="stylesheet" href="src/brand/fonts.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings-shell settings-launch-shell">
    <div class="brand">
      <!-- Same mark as the popup header, so this hand-off page does not flash a
           different identity for the fraction of a second before it redirects. -->
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false">
          <path class="bm-moon" d="M25.6 15.1A12.4 12.4 0 1 0 20.4 39.1" fill="none" stroke-linecap="round"/>
          <path class="bm-star" d="M30.2 4.9C30.85 12.6 35.4 17.15 43.1 17.5 35.4 17.85 30.85 22.4 30.2 30.1 29.55 22.4 25 17.85 17.3 17.5 25 17.15 29.55 12.6 30.2 4.9Z"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">远黛</div>
        <div class="brand-sub">YUANDAI</div>
        <div class="brand-caption">Alaxee Proxy · 完整设置</div>
      </div>
    </div>
    <section class="launch-card" role="status" aria-live="polite">
      <div class="eyebrow">CONTROL CENTER</div>
      <h1>正在打开完整设置</h1>
      <p>正在载入与快捷面板共用的代理模式、连接和域名规则控制界面…</p>
    </section>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
