<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="src/brand/fonts.css">

</head>
<body>

        <img class="brand-icon" alt="" width="34" height="34" src="src/brand/icons/icon-day-small.svg" />
      </div>
      <div>
        <div class="brand-name">远黛</div>
        <div class="brand-sub">YUANDAI</div>
        <div class="brand-caption">Alaxee Proxy · 完整设置</div>
      </div>
    </div>
    <section class="launch-card" role="status" aria-live="polite">
      <div class="eyebrow">ALAXEE PROXY</div>
      <h1>正在打开完整设置</h1>
      <p>正在载入与快捷面板共用的代理模式、连接和域名规则控制界面…</p>
    </section>

  <script type="module" src="settings.js"></script>
