<!-- 网页图标：把 brand/web/ 放到网站根目录（或改下面的路径），这几行贴进 <head> -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">  <!-- 会动的小图标；想跟着时段换，加 data-ax-icon（见 README） -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">               <!-- 记得把里面的 name 改成你的应用名 -->
<meta name="theme-color" content="#FAF6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141013" media="(prefers-color-scheme: dark)">
