<linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E97DAE"/><stop offset=".4" stop-color="#F4A3C3"/><stop offset=".72" stop-color="#FFD0DE"/><stop offset="1" stop-color="#FFF4E6"/></linearGradient>
<linearGradient id="seaDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2E4"/><stop offset=".25" stop-color="#FBC4D4"/><stop offset=".7" stop-color="#E592B4"/><stop offset="1" stop-color="#B8638C"/></linearGradient>
<linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset=".25" stop-color="#FFE4C4" stop-opacity=".7"/><stop offset=".55" stop-color="#FFF"/><stop offset=".85" stop-color="#FFE4C4" stop-opacity=".7"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<linearGradient id="fHot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF0C6"/></linearGradient>
<linearGradient id="fWarm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE4A8"/><stop offset="1" stop-color="#FF9680"/></linearGradient>
<linearGradient id="fRose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD2AE"/><stop offset="1" stop-color="#DC70B4"/></linearGradient>
<linearGradient id="fCold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F2A0C4"/><stop offset="1" stop-color="#FFE2EE"/></linearGradient>
