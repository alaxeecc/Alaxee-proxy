</defs>
<defs>
  <mask id="mm" maskUnits="userSpaceOnUse" x="-20" y="-20" width="180" height="180"><rect x="-20" y="-20" width="180" height="180" fill="#fff"/><circle cx="80" cy="54" r="39" fill="#000"/></mask>
  <clipPath id="mo"><circle cx="54" cy="70" r="50"/></clipPath>
  <clipPath id="mc"><rect width="140" height="140" rx="32"/></clipPath>
</defs>
<g clip-path="url(#mc)">
<rect width="140" height="140" fill="url(#skyDay)"/>
<circle cx="54" cy="70" r="50" fill="#FFF" opacity=".28" mask="url(#mm)"/>
<circle cx="54" cy="70" r="50" fill="none" stroke="#FFF" stroke-width="2" stroke-dasharray="5 6" opacity=".55"/>
<path d="M37.6 24.9 A48 48 0 0 0 8.9 86.4" fill="none" stroke="#FFF" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
<g fill="url(#cloudDay)"><g><circle cx="22" cy="40" r="10"/><circle cx="34" cy="35" r="13"/><circle cx="47" cy="41" r="9"/><rect x="12" y="40" width="44" height="11" rx="5.5"/><animateTransform attributeName="transform" type="translate" values="-6,0;12,0;-6,0" dur="13s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g><g opacity=".92"><circle cx="110" cy="92" r="8"/><circle cx="120" cy="88" r="10"/><circle cx="131" cy="93" r="7"/><rect x="102" y="92" width="36" height="8" rx="4"/><animateTransform attributeName="transform" type="translate" values="6,0;-10,0;6,0" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g></g>
<!--hero--><g transform="translate(92 52)">
  <circle r="56" fill="url(#auraDay)"><animate attributeName="r" values="46;64;46" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  <circle r="14" fill="none" stroke="#FFF" stroke-width="3"><animate attributeName="r" values="12;60" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".2 .6 .35 1"/><animate attributeName="opacity" values=".8;0" dur="4s" repeatCount="indefinite"/></circle>
  <g opacity=".55"><use href="#sp" transform="scale(62)" fill="#FFF"/><use href="#sp" transform="rotate(22.5) scale(48)" fill="#FFF6D8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28.8s" repeatCount="indefinite"/></g>
  <circle r="40" fill="none" stroke="url(#rainbow)" stroke-width="4" opacity=".75"><animate attributeName="r" values="37;43;37" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  <circle r="30" fill="none" stroke="url(#rainbow)" stroke-width="2.6" opacity=".55"><animate attributeName="r" values="32;27;32" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  <circle r="23" fill="url(#sunDay)"><animate attributeName="r" values="21;25;21" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  <g><use href="#prism" transform="scale(.66)"/><animateTransform attributeName="transform" type="scale" values=".88;1.16;.88" dur="4s" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
</g><!--/hero-->
<g fill="none" stroke="#B86A90" stroke-width="2.6" stroke-linecap="round"><g><path d="M0 0 q4.5 -4.5 9 0 q4.5 -4.5 9 0"/><path d="M18 9 q3.5 -3.5 7 0 q3.5 -3.5 7 0"/><animateTransform attributeName="transform" type="translate" values="-40,70;150,56" dur="15s" repeatCount="indefinite"/></g></g>
<rect y="106" width="140" height="34" fill="url(#seaDay)"/>
<rect y="104.6" width="140" height="3" fill="url(#horizon)"/>
<rect x="80" y="108" width="24" height="30" fill="#FFF" opacity=".35"><animate attributeName="opacity" values=".2;.5;.2" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
<g fill="#FFF"><use href="#sp" transform="translate(38 118) scale(4)"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use><use href="#sp" transform="translate(88 116) scale(5)"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use><use href="#sp" transform="translate(118 128) scale(3.6)"><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use><use href="#sp" transform="translate(62 130) scale(3)"><animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use></g>
<use href="#glass"/>
</g>
<rect x="1" y="1" width="138" height="138" rx="31" fill="none" stroke="#FFF" stroke-opacity=".35" stroke-width="2"/>
