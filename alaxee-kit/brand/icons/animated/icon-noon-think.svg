<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
<defs>
<path id="sp" d="M0 -1 C.05 -.18 .18 -.05 1 0 C.18 .05 .05 .18 0 1 C-.05 .18 -.18 .05 -1 0 C-.18 -.05 -.05 -.18 0 -1Z"/>
<linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E97DAE"/><stop offset=".4" stop-color="#F4A3C3"/><stop offset=".72" stop-color="#FFD0DE"/><stop offset="1" stop-color="#FFF4E6"/></linearGradient>
<linearGradient id="seaDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2E4"/><stop offset=".25" stop-color="#FBC4D4"/><stop offset=".7" stop-color="#E592B4"/><stop offset="1" stop-color="#B8638C"/></linearGradient>
<linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset=".25" stop-color="#FFE4C4" stop-opacity=".7"/><stop offset=".55" stop-color="#FFF"/><stop offset=".85" stop-color="#FFE4C4" stop-opacity=".7"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<linearGradient id="fHot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF0C6"/></linearGradient>
<linearGradient id="fWarm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE4A8"/><stop offset="1" stop-color="#FF9680"/></linearGradient>
<linearGradient id="fRose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD2AE"/><stop offset="1" stop-color="#DC70B4"/></linearGradient>
<linearGradient id="fCold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F2A0C4"/><stop offset="1" stop-color="#FFE2EE"/></linearGradient>
<radialGradient id="sunDay"><stop offset="0" stop-color="#FFF"/><stop offset=".6" stop-color="#FFF6D8"/><stop offset="1" stop-color="#FFD890"/></radialGradient>
<radialGradient id="auraDay"><stop offset="0" stop-color="#FFF" stop-opacity=".95"/><stop offset=".35" stop-color="#FFF0C8" stop-opacity=".5"/><stop offset="1" stop-color="#FFF0C8" stop-opacity="0"/></radialGradient>
<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB0C8"/><stop offset=".35" stop-color="#FFE4A8"/><stop offset=".65" stop-color="#CFF2E2"/><stop offset="1" stop-color="#E6C8FF"/></linearGradient>
<linearGradient id="cloudDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE0EA"/></linearGradient>
<linearGradient id="dome" x1=".2" y1="0" x2=".8" y2=".55"><stop offset="0" stop-color="#FFF" stop-opacity=".38"/><stop offset=".45" stop-color="#FFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<linearGradient id="rimTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".7"/><stop offset=".35" stop-color="#FFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFE4B8" stop-opacity=".48"/></linearGradient>
<clipPath id="ic"><rect width="140" height="140" rx="32"/></clipPath>
<mask id="moonMask" maskUnits="userSpaceOnUse" x="-30" y="-30" width="200" height="200"><rect x="-30" y="-30" width="200" height="200" fill="#fff"/><circle cx="78" cy="54" r="42.5" fill="#000"/></mask>
<g id="cres"><circle cx="56" cy="66" r="49" mask="url(#moonMask)"/></g>
<g id="prism"><g transform="rotate(45)">
    <path d="M0 0 L-5.8 -5.8 Q-2 -17 0 -41 Z" fill="url(#fHot)"/><path d="M0 0 L0 -41 Q2 -17 5.8 -5.8 Z" fill="url(#fWarm)"/>
    <path d="M0 0 L5.8 -5.8 Q12 -1.6 27 0 Z" fill="url(#fHot)"/><path d="M0 0 L27 0 Q12 1.6 5.8 5.8 Z" fill="url(#fRose)"/>
    <path d="M0 0 L5.8 5.8 Q2 17 0 41 Z" fill="url(#fRose)"/><path d="M0 0 L0 41 Q-2 17 -5.8 5.8 Z" fill="url(#fCold)"/>
    <path d="M0 0 L-5.8 5.8 Q-12 1.6 -27 0 Z" fill="url(#fCold)"/><path d="M0 0 L-27 0 Q-12 -1.6 -5.8 -5.8 Z" fill="url(#fHot)"/>
    <line x1="0" y1="-39" x2="0" y2="39" stroke="#FFF" stroke-width=".9" opacity=".88"/><line x1="-25" y1="0" x2="25" y2="0" stroke="#FFF" stroke-width=".75" opacity=".8"/>
    <polygon points="0,-6.2 4.6,0 0,6.2 -4.6,0" fill="#FFF"/></g></g>
<g id="glass"><ellipse cx="52" cy="14" rx="68" ry="26" fill="url(#dome)"/><rect x="1.5" y="1.5" width="137" height="137" rx="30.5" fill="none" stroke="url(#rimTop)" stroke-width="2.4"/></g>
<g id="sDay">
    <rect width="140" height="140" fill="url(#skyDay)"/>
    <use href="#cres" fill="#FFF" opacity=".3"/>
    <circle cx="56" cy="66" r="49" fill="none" stroke="#FFF" stroke-width=".9" stroke-dasharray="3 4" opacity=".5"/>
    <path d="M56 17 A49 49 0 0 0 10 83" fill="none" stroke="#FFF" stroke-width="1.2" opacity=".55"/>
    <!-- 远积云 -->
    <g fill="url(#cloudDay)" opacity=".7"><g><circle cx="24" cy="22" r="6"/><circle cx="32" cy="19" r="8"/><circle cx="41" cy="23" r="5"/><rect x="18" y="22" width="28" height="6" rx="3"/>
      <animateTransform attributeName="transform" type="translate" values="-8,0;10,0;-8,0" dur="16s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g></g>
    <!-- 中积云 -->
    <g fill="url(#cloudDay)"><g><circle cx="22" cy="38" r="8"/><circle cx="32" cy="34" r="10"/><circle cx="42" cy="39" r="7"/><rect x="14" y="38" width="34" height="8" rx="4"/>
      <animateTransform attributeName="transform" type="translate" values="-6,0;12,0;-6,0" dur="13s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g>
      <g opacity=".9"><circle cx="112" cy="88" r="6"/><circle cx="120" cy="85" r="8"/><circle cx="129" cy="89" r="5"/><rect x="106" y="88" width="28" height="6" rx="3"/>
      <animateTransform attributeName="transform" type="translate" values="6,0;-10,0;6,0" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g></g>
    <!-- 太阳：强呼吸日冕 -->
    <g transform="translate(88 50)">
      <circle r="56" fill="url(#auraDay)"><animate attributeName="r" values="48;64;48" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
      <circle r="13" fill="none" stroke="#FFF" stroke-width="1.4"><animate attributeName="r" values="12;58" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".2 .6 .35 1"/><animate attributeName="opacity" values=".7;0" dur="1.80s" repeatCount="indefinite"/></circle>
      <g opacity=".5"><use href="#sp" transform="scale(62)" fill="#FFF"/><use href="#sp" transform="rotate(22.5) scale(48)" fill="#FFF6D8"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/></g>
      <g opacity=".35"><use href="#sp" transform="rotate(45) scale(52)" fill="#FFF"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/></g>
      <circle r="40" fill="none" stroke="url(#rainbow)" stroke-width="2.4" opacity=".65"><animate attributeName="r" values="37;43;37" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
      <circle r="30" fill="none" stroke="url(#rainbow)" stroke-width="1.4" opacity=".45"><animate attributeName="r" values="32;27;32" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
      <circle r="21" fill="url(#sunDay)"><animate attributeName="r" values="19.5;22.5;19.5" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
      <g><use href="#prism" transform="scale(.55)"/><animateTransform attributeName="transform" type="scale" values=".88;1.16;.88" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g>
    </g>
    <!-- 近景小云掠过底部 -->
    <g fill="url(#cloudDay)" opacity=".95"><g><circle cx="30" cy="98" r="5"/><circle cx="37" cy="96" r="6"/><rect x="25" y="97" width="18" height="5" rx="2.5"/>
      <animateTransform attributeName="transform" type="translate" values="10,0;-14,0;10,0" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></g></g>
    <g fill="none" stroke="#B86A90" stroke-width="1.1" stroke-linecap="round" opacity=".8">
      <g><path d="M0 0 q2.6 -2.6 5.2 0 q2.6 -2.6 5.2 0"/><path d="M12 5 q2 -2 4 0 q2 -2 4 0"/>
        <animateTransform attributeName="transform" type="translate" values="-26,66;152,52" dur="15s" repeatCount="indefinite"/></g>
    </g>
    <rect y="104" width="140" height="36" fill="url(#seaDay)"/>
    <rect y="103.3" width="140" height="1.6" fill="url(#horizon)"/>
    <rect x="78" y="106" width="20" height="30" fill="#FFF" opacity=".35"><animate attributeName="opacity" values=".2;.5;.2" dur="1.80s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
    <g fill="#FFF">
      <use href="#sp" transform="translate(40 116) scale(2.4)"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
      <use href="#sp" transform="translate(88 114) scale(3)"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
      <use href="#sp" transform="translate(118 126) scale(2)"><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin=".5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
      <use href="#sp" transform="translate(64 128) scale(1.6)"><animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
      <use href="#sp" transform="translate(104 120) scale(1.4)"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin=".3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
      <use href="#sp" transform="translate(24 126) scale(1.3)"><animate attributeName="opacity" values="1;0;1" dur="2s" begin=".7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></use>
    </g>
    <use href="#glass"/>
  </g>
<g id="eDay"><g clip-path="url(#ic)"><use href="#sDay"/></g><rect width="140" height="140" rx="32" fill="none" stroke="#FFF" stroke-opacity=".4"/></g>
</defs>
<use href="#eDay"/><g clip-path="url(#ic)"><use href="#glass"/></g>
</svg>
