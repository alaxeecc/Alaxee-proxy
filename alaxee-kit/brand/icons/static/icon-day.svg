      <g mask="url(#moonMask)" fill="#B0688E"><circle cx="36" cy="50" r="4.2" opacity=".15"/><circle cx="34" cy="74" r="3.6" opacity=".13"/><circle cx="46" cy="88" r="2.8" opacity=".12"/></g>
      <path d="M56 17 A49 49 0 0 0 10 83" fill="none" stroke="#FFF" stroke-width="1.4" stroke-linecap="round" opacity=".78"/>
      <circle cx="78" cy="54" r="42.5" fill="none" stroke="url(#moonRim)" stroke-width="2.6" clip-path="url(#moonOuter)"></circle>
      
    </g>
    <!-- 强呼吸主星：振幅 ±21% + 光晕 ±35% + 双涟漪 + 光芒同频 -->
    <g transform="translate(88 53)">
      <circle r="44" fill="url(#aura)"></circle>
      <circle r="13" fill="none" stroke="#FFF4D4" stroke-width="1.6"></circle>
      <circle r="13" fill="none" stroke="#FFC8E2" stroke-width="1.3"></circle>
      <g><use href="#sp" transform="scale(58 2)" fill="#FFF"/><use href="#sp" transform="scale(2 44)" fill="#FFF"/></g>
      <g opacity=".42"><use href="#sp" transform="scale(44)" fill="#FFE4B8"/></g>
      <g opacity=".6"><use href="#sp" transform="rotate(22.5) scale(28)" fill="#FFC8E0"/></g>
      <g filter="url(#starDrop)"><use href="#prism"/><circle r="4.6" fill="#FFF" filter="url(#soft)"></circle>
        </g>
      <g transform="translate(23 -19)"><g><use href="#sp" transform="rotate(45) scale(4.5 6.8)" fill="#FFF"/></g></g>
    </g>
    <g><path d="M-8 105 L-8 97 Q8 89 22 95 Q40 86 58 93 Q76 84 94 91 Q112 85 130 93 Q146 87 152 97 L152 105 Z" fill="url(#cloudMid)"/></g>
    <g transform="translate(72 64) rotate(-21)">
      <path d="M-58 0 A58 17 0 0 0 58 0" fill="none" stroke="url(#orbitF)" stroke-width="1.8" stroke-linecap="round"/>
      <g opacity="0"><g><circle r="9" fill="#FFE8BE" opacity=".42" filter="url(#soft)"/><circle r="4.8" fill="url(#pearl)"/>
        </g>
        
        </g>
    </g>
    <g><path d="M50 106 Q64 96 80 101 Q96 93 114 99 Q130 95 146 103 L146 106 Z" fill="url(#cloudNear)"/></g>
