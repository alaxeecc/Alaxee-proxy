      <polygon points="0,0 22,-102 52,-90" fill="url(#ray)"/><polygon points="0,0 56,-72 72,-46" fill="url(#ray)" opacity=".65"/>
      
    </g></g>
    <rect y="92" width="140" height="14" fill="url(#atm)"/>
    <rect y="104" width="140" height="36" fill="url(#seaDawn)"/>
