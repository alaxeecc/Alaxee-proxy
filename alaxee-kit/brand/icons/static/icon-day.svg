    <g fill="#FFD6E4" opacity=".4" filter="url(#blurFar)"><circle cx="14" cy="18" r=".9"/><circle cx="30" cy="9" r=".7"/><circle cx="62" cy="8" r=".8"/><circle cx="132" cy="14" r=".7"/></g>
