    <line x1="76" y1="110" x2="98" y2="110" stroke="#FFF4D2" stroke-width="2.2" stroke-linecap="round"></line>
    <line x1="80" y1="117" x2="94" y2="117" stroke="#FFC4DC" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
    <g transform="translate(72 64) rotate(-21)">
