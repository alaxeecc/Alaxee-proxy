<radialGradient id="aura"><stop offset="0" stop-color="#FFFBE8" stop-opacity=".95"/><stop offset=".35" stop-color="#FFD0A8" stop-opacity=".45"/><stop offset=".68" stop-color="#F294C4" stop-opacity=".16"/><stop offset="1" stop-color="#F294C4" stop-opacity="0"/></radialGradient>
<linearGradient id="cloudMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E4" stop-opacity=".85"/><stop offset=".55" stop-color="#FFC8DA" stop-opacity=".72"/><stop offset="1" stop-color="#DA8DB2" stop-opacity=".62"/></linearGradient>
<linearGradient id="cloudNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".94"/><stop offset="1" stop-color="#FFD8E4" stop-opacity=".5"/></linearGradient>
<linearGradient id="orbitF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC8DC" stop-opacity=".4"/><stop offset=".5" stop-color="#FFF4D6"/><stop offset="1" stop-color="#FFB2A8" stop-opacity=".45"/></linearGradient>
<radialGradient id="pearl" cx=".35" cy=".3" r=".72"><stop offset="0" stop-color="#FFF"/><stop offset=".55" stop-color="#FFE6BC"/><stop offset="1" stop-color="#D080C4"/></radialGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8E0" stop-opacity=".8"/><stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/></linearGradient>
<linearGradient id="dome" x1=".2" y1="0" x2=".8" y2=".55"><stop offset="0" stop-color="#FFF" stop-opacity=".38"/><stop offset=".45" stop-color="#FFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<linearGradient id="rimTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".7"/><stop offset=".35" stop-color="#FFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFE4B8" stop-opacity=".48"/></linearGradient>
<linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="1" stop-color="#FFF" stop-opacity=".95"/></linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
