name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Build extension package
        run: npm run package:extension

      # Every push produces a downloadable zip, so reviewing a change does not
      # require a local Node/Python toolchain. Loading it is still one-time; see the
      # install section of README for why reinstalling is not needed.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: alaxee-proxy-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
